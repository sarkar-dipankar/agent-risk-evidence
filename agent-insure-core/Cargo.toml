[workspace]
resolver = "2"
members = ["crates/ai-schema", "crates/ai-storage", "crates/ai-benchmarks", "crates/ai-attestation"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/agent-insure/agent-insure-core"
authors = ["Agent Insure Contributors"]

[workspace.dependencies]
# Core schema types
ai-schema = { path = "crates/ai-schema" }
ai-attestation = { path = "crates/ai-attestation" }
ai-storage = { path = "crates/ai-storage" }
ai-benchmarks = { path = "crates/ai-benchmarks" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# JSON Schema validation
jsonschema = "0.18"

# HTTP/gRPC
axum = "0.7"
tonic = "0.11"
prost = "0.12"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "sqlite", "chrono", "uuid"] }
async-trait = "0.1"

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Decimal
rust_decimal = { version = "1.33", features = ["serde", "serde-with-str"] }

# Configuration
config = "0.14"

# Testing
mockall = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
